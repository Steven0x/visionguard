# Local dev infra only: Postgres (with pgvector) + Redis.
# Real data lives in Supabase / Upstash — point DATABASE_URL / REDIS_URL there via .env.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: visionguard
      POSTGRES_PASSWORD: visionguard
      POSTGRES_DB: visionguard
    ports:
      - "5433:5432"  # 5433 on host to avoid clashing with other local Postgres
    volumes:
      - vg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionguard -d visionguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # 6380 on host to avoid clashing with other local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for dev/tests (production uses Cloudflare R2).
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # console
    volumes:
      - vg_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the vg-assets bucket, then exit.
  minio-setup:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/vg-assets &&
      echo 'bucket vg-assets ready'
      "

volumes:
  vg_pgdata:
  vg_minio:
