name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: visionguard
          POSTGRES_PASSWORD: visionguard
          POSTGRES_DB: visionguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visionguard -d visionguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # bitnami/minio starts the server automatically (GH service containers can't pass a
      # command) and pre-creates the bucket via MINIO_DEFAULT_BUCKETS. Readiness is polled by
      # the "Wait for MinIO" step below (no dependency on in-image CLIs for a health probe).
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: vg-assets
        ports:
          - 9000:9000
    env:
      APP_ENV: test
      AUTH_TEST_MODE: "1"
      DATABASE_URL: postgresql+psycopg://visionguard:visionguard@localhost:5432/visionguard
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_ORIGINS: http://localhost:5173
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_BUCKET: vg-assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Wait for MinIO + ensure bucket
        run: |
          python - <<'PY'
          import time
          import boto3
          from botocore.config import Config
          client = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="minioadmin",
              aws_secret_access_key="minioadmin",
              region_name="us-east-1",
              config=Config(signature_version="s3v4"),
          )
          for _ in range(30):
              try:
                  client.list_buckets()
                  try:
                      client.create_bucket(Bucket="vg-assets")
                  except Exception:
                      pass
                  print("minio ready")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("minio did not become ready")
          PY
      - name: Lint (ruff)
        run: ruff check api worker
      - name: Typecheck (mypy)
        run: mypy api worker
      - name: Test (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Test (vitest)
        run: npm run test -- --run
      - name: Build
        run: npm run build
