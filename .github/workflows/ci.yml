name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: visionguard
          POSTGRES_PASSWORD: visionguard
          POSTGRES_DB: visionguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visionguard -d visionguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      AUTH_TEST_MODE: "1"
      DATABASE_URL: postgresql+psycopg://visionguard:visionguard@localhost:5432/visionguard
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_ORIGINS: http://localhost:5173
      # In-memory storage + fake embedder/fetcher/providers → CI needs no MinIO, no torch,
      # and makes no network calls.
      STORAGE_BACKEND: fake
      EMBEDDER_BACKEND: fake
      FETCHER_BACKEND: fake
      PROVIDER_BACKEND: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check api worker
      - name: Typecheck (mypy)
        run: mypy api worker
      - name: Test (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Test (vitest)
        run: npm run test -- --run
      - name: Build
        run: npm run build
